<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행정동별 시간대 주문수 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f2; --panel:#ffffff; --ink:#1d1d1f; --sub:#6b6b70; --line:#e4e2dd;
    --accent:#d1281f; --chip:#f1efea;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;top:16px;left:16px;width:300px;background:var(--panel);
    border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:16px 16px 14px}
  .panel h1{font-size:16px;margin:0 0 2px;font-weight:800;letter-spacing:-.3px}
  .panel .desc{font-size:12px;color:var(--sub);margin-bottom:14px}
  .lbl{font-size:11px;font-weight:600;color:var(--sub);margin:12px 0 6px;letter-spacing:.2px}
  .seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:8px;font:600 13px 'Noto Sans KR',sans-serif;color:var(--sub);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .hourrow{display:flex;align-items:center;gap:10px}
  .hourval{font-size:24px;font-weight:800;letter-spacing:-.5px;flex:1}
  .hourval small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
  .play{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:30px;cursor:pointer;font-size:13px}
  .dual{position:relative;height:28px;margin-top:4px}
  .dual .track{position:absolute;left:0;right:0;top:12px;height:5px;border-radius:3px;background:#e4e2dd}
  .dual .fill{position:absolute;top:12px;height:5px;border-radius:3px;background:var(--accent)}
  .dual input[type=range]{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input[type=range]::-webkit-slider-runnable-track{background:none;height:28px}
  .dual input[type=range]::-moz-range-track{background:none}
  .dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);margin-top:5px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .dual input[type=range]:focus{outline:none}
  .quick{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 7px;font:600 11px 'Noto Sans KR',sans-serif;color:var(--sub);cursor:pointer}
  .quick button:hover{color:var(--ink);border-color:#bbb}
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);padding:0 2px}
  .chk{display:flex;align-items:center;gap:6px;font-size:12px;margin-top:8px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);margin:0}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .total span{font-size:12px;color:var(--sub)}
  .total b{font-size:20px;font-weight:800}
  .legend{display:flex;margin-top:6px;border-radius:4px;overflow:hidden}
  .legend div{flex:1;height:12px}
  .legend-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:3px}
  .top{margin:0;padding:0;list-style:none;font-size:12px}
  .top li{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .top li:last-child{border-bottom:0}
  .top li b{font-weight:700}
  .dlabel{background:none;border:0;text-align:center;pointer-events:none;white-space:nowrap}
  .dlabel .n{font-size:11px;font-weight:600;color:#333;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;line-height:1.1}
  .dlabel .v{font-size:14px;font-weight:800;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;line-height:1.15}
  .hide-names .dlabel .n{display:none}
  .leaflet-tooltip.tip{font-family:'Noto Sans KR',sans-serif;font-size:12px;border-radius:8px;padding:8px 10px}
  .tip b{font-size:13px}
  .collapse{position:absolute;top:12px;right:12px;border:0;background:none;font-size:16px;cursor:pointer;color:var(--sub)}
  .panel.min .body{display:none}
  @media (max-width:600px){
    .panel{left:8px;right:8px;top:8px;width:auto;padding:12px}
    .hourval{font-size:22px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel" id="panel">
  <button class="collapse" id="collapse" title="접기">–</button>
  <h1>행정동별 주문수</h1>
  <div class="desc">숫자 = 주문수 · 색이 진할수록 주문 많음</div>
  <div class="body">
    <div class="lbl">배달 유형</div>
    <div class="seg" id="typeSeg">
      <button data-t="ALL" class="on">전체</button>
      <button data-t="OD">OD</button>
      <button data-t="VD">VD</button>
    </div>

    <div class="lbl">시간</div>
    <div class="hourrow">
      <div class="hourval" id="hourVal">12~12<small>시</small></div>
      <button class="play" id="play" title="재생">▶</button>
    </div>
    <div class="dual">
      <div class="track"></div><div class="fill" id="fill"></div>
      <input type="range" id="hFrom" min="0" max="23" step="1" value="12" aria-label="시작 시간">
      <input type="range" id="hTo" min="0" max="23" step="1" value="12" aria-label="끝 시간">
    </div>
    <div class="ticks"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div>
    <div class="quick" id="quick">
      <button data-r="0,23">하루 전체</button>
      <button data-r="11,13" title="11~13시">점심</button>
      <button data-r="17,20" title="17~20시">저녁</button>
      <button data-r="0,5" title="0~5시">심야</button>
    </div>
    <label class="chk"><input type="checkbox" id="fixedScale" checked> 색상 기준 고정 (같은 길이 구간끼리 비교)</label>
    <label class="chk"><input type="checkbox" id="showNames" checked> 동 이름 표시</label>

    <div class="total"><span id="totalLbl">선택 시간 총 주문</span><b id="total">0</b></div>
    <div class="legend" id="legend"></div>
    <div class="legend-lbl" id="legendLbl"></div>

    <div class="lbl">주문 많은 동 TOP 5</div>
    <ul class="top" id="top"></ul>
  </div>
</div>

const COLORS = ['#fff3d6','#fedb8f','#fdb85a','#fb8c3c','#ef5a2b','#d1281f','#9b0d1d'];
const ZERO = '#ececec';

const state = { type:'ALL', from:12, to:12, fixed:true };

const map = L.map('map',{zoomControl:false,zoomSnap:0.25,zoomDelta:0.5}).setView([37.49,127.02],13);
// 배경지도: API 키 없이 쓰는 타일 (Esri 회색 / OSM)
const esriGray=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri',maxZoom:16
});
const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors',maxZoom:19
});
esriGray.addTo(map);
L.control.layers({'회색 지도':esriGray,'OSM 일반 지도':osm},null,{position:'bottomright'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);

// ---- 데이터 계산 ----
function hourVals(type,h){
  const out={};
  const types = type==='ALL' ? ['OD','VD'] : [type];
  types.forEach(t=>{
    const o=(DEM[t]||{})[h]||{};
    for(const k in o) out[k]=(out[k]||0)+o[k];
  });
  return out;
}
function rangeVals(type,from,to){
  const out={};
  for(let h=from;h<=to;h++){ const o=hourVals(type,h); for(const k in o) out[k]=(out[k]||0)+o[k]; }
  return out;
}
function currentVals(){ return rangeVals(state.type,state.from,state.to); }
// 분위수 기반 구간 (값이 한쪽에 쏠려도 색이 고르게 퍼지도록)
function makeBreaks(arr){
  const v=arr.filter(x=>x>0).sort((a,b)=>a-b);
  if(!v.length) return [];
  const n=COLORS.length, br=[];
  for(let i=1;i<n;i++){ br.push(v[Math.min(v.length-1,Math.floor(v.length*i/n))]); }
  const uniq=[...new Set(br)].filter(x=>x<v[v.length-1]);
  return uniq;
}
let breaks=[];
function scaleSource(){
  const w=state.to-state.from;
  if(!state.fixed || w>=23) return Object.values(currentVals());
  // 고정: 지금과 같은 길이(시간 수)의 모든 구간 값을 모아 색 구간 산정 → 시간대끼리 비교 가능
  const all=[];
  for(let a=0;a+w<=23;a++) all.push(...Object.values(rangeVals(state.type,a,a+w)));
  return all;
}
function colorOf(x){
  if(!x) return ZERO;
  let i=0; while(i<breaks.length && x>breaks[i]) i++;
  // 구간 수가 적을 때도 진한 색까지 쓰도록 인덱스 늘리기
  const steps=breaks.length+1;
  const idx = steps>=COLORS.length ? i : Math.round(i*(COLORS.length-1)/Math.max(1,steps-1));
  return COLORS[Math.min(idx,COLORS.length-1)];
}
const fmt=n=>n.toLocaleString('ko-KR');
const pad=h=>String(h).padStart(2,'0');
const rangeTxt=()=>state.from===state.to?`${pad(state.from)}시`:`${pad(state.from)}~${pad(state.to)}시`;

// ---- 레이어 ----
let vals={};
const labels={};
let hl=null;
function highlight(l){ if(hl&&hl!==l) unhighlight(hl); hl=l; l.setStyle({weight:3.2,color:'#000'}); l.bringToFront(); }
function unhighlight(l){ l.setStyle({weight:1.4,color:'#2b2b2b'}); l.closeTooltip(); if(hl===l) hl=null; }
const layer = L.geoJSON(GEO,{
  style:()=>({color:'#2b2b2b',weight:1.4,opacity:.9,fillOpacity:.78,fillColor:ZERO}),
  onEachFeature:(f,l)=>{
    l.on({
      mouseover:e=>{ highlight(e.target); },
      mouseout:e=>{ unhighlight(e.target); }
    });
    l.bindTooltip(()=>tipHtml(f.properties),{sticky:true,className:'tip',direction:'top',offset:[0,-6]});
  }
}).addTo(map);
const wide=window.innerWidth>600;
map.on('mouseout',()=>{ if(hl) unhighlight(hl); });
map.fitBounds(layer.getBounds(),wide?{paddingTopLeft:[330,10],paddingBottomRight:[10,10]}:{padding:[10,10]});

GEO.features.forEach(f=>{
  const p=f.properties;
  labels[p.cd]=L.marker(p.lp,{interactive:false,keyboard:false,
    icon:L.divIcon({className:'dlabel',html:'',iconSize:[90,32],iconAnchor:[45,16]})}).addTo(map);
});

function tipHtml(p){
  const v=vals[p.cd]||0;
  let s=`<b>${p.nm}</b><br>주문 <b>${fmt(v)}</b>건`;
  if(state.type==='ALL'){
    const pick=t=>{ let a=0; for(let h=state.from;h<=state.to;h++) a+=((DEM[t]||{})[h]||{})[p.cd]||0; return a; };
    s+=`<br><span style="color:#6b6b70">OD ${fmt(pick('OD'))} · VD ${fmt(pick('VD'))}</span>`;
  }
  return s;
}

function render(){
  vals=currentVals();
  breaks=makeBreaks(scaleSource());

  const top=Object.entries(vals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  document.getElementById('top').innerHTML = top.length ? top.map(([cd,v],i)=>
    `<li data-cd="${cd}"><span>${i+1}. ${nm[cd]?nm[cd].nm:cd}</span><b>${fmt(v)}</b></li>`).join('')
    : '<li><span style="color:#6b6b70">주문 없음</span></li>';
  document.querySelectorAll('#top li[data-cd]').forEach(li=>li.onclick=()=>{
    layer.eachLayer(l=>{ if(String(l.feature.properties.cd)===li.dataset.cd) map.fitBounds(l.getBounds(),{maxZoom:15}); });
  });
  document.getElementById('hourVal').innerHTML = state.from===state.to
    ? `${pad(state.from)}<small>시</small>` : `${pad(state.from)}~${pad(state.to)}<small>시</small>`;
  const f=document.getElementById('fill');
  f.style.left=`calc(${state.from/23*100}% + ${9-state.from/23*18}px)`;
  f.style.width=`calc(${(state.to-state.from)/23*100}% + ${-(state.to-state.from)/23*18}px)`;
}

// ---- 컨트롤 ----
document.querySelectorAll('#typeSeg button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.type=b.dataset.t; render();
});
const sFrom=document.getElementById('hFrom'), sTo=document.getElementById('hTo');
function setRange(a,b){
  state.from=Math.min(a,b); state.to=Math.max(a,b);
  sFrom.value=state.from; sTo.value=state.to;
  // 두 손잡이가 겹쳤을 때 잡을 수 있도록 위쪽 손잡이 조정
  sFrom.style.zIndex = state.from>=20 ? 3 : 1; sTo.style.zIndex=2;
  render();
}
sFrom.oninput=()=>{ stopPlay(); let a=+sFrom.value; if(a>state.to){a=state.to;} setRange(a,state.to); };
sTo.oninput=()=>{ stopPlay(); let b=+sTo.value; if(b<state.from){b=state.from;} setRange(state.from,b); };
document.getElementById('fixedScale').onchange=e=>{ state.fixed=e.target.checked; render(); };
document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>{ stopPlay(); const [a,c]=b.dataset.r.split(',').map(Number); setRange(a,c); });

// ▶ 재생: 지금 구간 길이를 유지한 채 1시간씩 이동
let timer=null; const playBtn=document.getElementById('play');
function stopPlay(){ clearInterval(timer); timer=null; playBtn.textContent='▶'; }
playBtn.onclick=()=>{
  if(timer){ stopPlay(); return; }
  if(state.to-state.from>=23) return;
  playBtn.textContent='❚❚';
  timer=setInterval(()=>{
    const w=state.to-state.from;
    let a=state.from+1; if(a+w>23) a=0;
    setRange(a,a+w);
  },900);
};
document.getElementById('collapse').onclick=()=>{
  const p=document.getElementById('panel'); p.classList.toggle('min');
  document.getElementById('collapse').textContent=p.classList.contains('min')?'+':'–';
};
// 줌이 너무 작으면 동 이름 자동 숨김
function zoomNames(){ document.body.classList.toggle('hide-names', map.getZoom()<12.75 || !document.getElementById('showNames').checked); }
map.on('zoomend',zoomNames);
document.getElementById('showNames').onchange=zoomNames;

render(); zoomNames();
</script>
</body>
</html>
